name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs still run repository-contract. This only decides which code jobs run.
  # A missing base fails open.
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      gateway: ${{ steps.filter.outputs.gateway }}
      hikvision: ${{ steps.filter.outputs.hikvision }}
      desktop_backend: ${{ steps.filter.outputs.desktop_backend }}
      desktop_frontend: ${{ steps.filter.outputs.desktop_frontend }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: filter
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/classify_ci_paths.py

  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.detect.outputs.engine }}
      gateway: ${{ steps.detect.outputs.gateway }}
      hikvision: ${{ steps.detect.outputs.hikvision }}
      desktop_backend: ${{ steps.detect.outputs.desktop_backend }}
      desktop_frontend: ${{ steps.detect.outputs.desktop_frontend }}
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        name: Detect implemented module manifests
        shell: bash
        run: |
          [[ -f engine/pyproject.toml ]] && echo "engine=true" >> "$GITHUB_OUTPUT" || echo "engine=false" >> "$GITHUB_OUTPUT"
          [[ -f gateway/pyproject.toml ]] && echo "gateway=true" >> "$GITHUB_OUTPUT" || echo "gateway=false" >> "$GITHUB_OUTPUT"
          [[ -f integrations/hikvision/pyproject.toml ]] && echo "hikvision=true" >> "$GITHUB_OUTPUT" || echo "hikvision=false" >> "$GITHUB_OUTPUT"
          [[ -f desktop/backend/pyproject.toml ]] && echo "desktop_backend=true" >> "$GITHUB_OUTPUT" || echo "desktop_backend=false" >> "$GITHUB_OUTPUT"
          [[ -f desktop/frontend/package-lock.json ]] && echo "desktop_frontend=true" >> "$GITHUB_OUTPUT" || echo "desktop_frontend=false" >> "$GITHUB_OUTPUT"
          [[ -f packaging/windows/build.ps1 ]] && echo "windows=true" >> "$GITHUB_OUTPUT" || echo "windows=false" >> "$GITHUB_OUTPUT"

  repository-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify repository contracts
        run: python scripts/ci/verify_repo.py

  engine:
    needs: [repository-contract, detect-modules, changes]
    if: ${{ needs.detect-modules.outputs.engine == 'true' && needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./engine
      - run: python -m pytest engine/tests

  hikvision:
    needs: [repository-contract, detect-modules, changes]
    if: ${{ needs.detect-modules.outputs.hikvision == 'true' && needs.changes.outputs.hikvision == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./integrations/hikvision
      - run: python -m pytest integrations/hikvision/tests

  gateway:
    needs: [repository-contract, detect-modules, changes]
    if: ${{ needs.detect-modules.outputs.gateway == 'true' && needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./engine -e ./gateway
      - run: python -m pytest gateway/tests

  desktop-backend:
    needs: [repository-contract, detect-modules, changes]
    if: ${{ needs.detect-modules.outputs.desktop_backend == 'true' && needs.changes.outputs.desktop_backend == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/backend/pyproject.toml
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./engine -e ./integrations/hikvision -e ./desktop/backend
      - run: python -m pytest desktop/backend/tests

  desktop-frontend:
    needs: [repository-contract, detect-modules, changes]
    if: ${{ needs.detect-modules.outputs.desktop_frontend == 'true' && needs.changes.outputs.desktop_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci --prefix desktop/frontend --cache desktop/frontend/.npm-cache
      - run: npm test --prefix desktop/frontend
      - run: npm run build --prefix desktop/frontend

  windows-smoke:
    needs: [repository-contract, detect-modules, changes]
    if: ${{ needs.detect-modules.outputs.windows == 'true' && needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Windows package
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Mode Verify

  quality-gate:
    if: ${{ always() }}
    needs: [changes, detect-modules, repository-contract, engine, hikvision, gateway, desktop-backend, desktop-frontend, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any failed or cancelled dependency
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Quality gate passed
        run: echo "All applicable TraceCue checks passed."
