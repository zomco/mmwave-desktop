name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after building
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce contracts and release prerequisites
        run: python scripts/ci/verify_repo.py --security --release

  build-windows:
    needs: readiness
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, sign and collect release artifacts
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Mode Release
      - name: Installed application smoke test
        shell: pwsh
        run: ./packaging/windows/smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tracecue-windows
          path: artifacts/**
          if-no-files-found: error

  attest:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tracecue-windows
          path: artifacts
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/**

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
    needs: [build-windows, attest]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tracecue-windows
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
