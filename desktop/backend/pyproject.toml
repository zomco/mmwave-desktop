[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecue-desktop"
version = "0.1.0"
description = "Loopback FastAPI control plane for TraceCue Desktop"
readme = { text = "TraceCue Desktop loopback API and background-job service.", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
  "fastapi>=0.115,<1",
  "tracecue-engine==0.1.0",
  "tracecue-hikvision==0.1.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
tracecue-desktop = "tracecue_desktop.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
