[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecue-gateway"
version = "0.1.0"
description = "Always-on timeline producer for TraceCue sensor deployments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = ["tracecue-engine==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
tracecue-gateway = "tracecue_gateway.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

